# A regression and reproducibility suite (docs/plan-sedml.md, phase 6): the first 300 curated SBML
# models in EBI BioModels (BIOMD0000000001 upward), each run on every solver and compared. Generated on 2026-10-22 by
# scripts/biomodels_suite.py; regenerate rather than edit the sources. Every curated SBML entry is included, whether or
# not it translates: the first run's failures are its findings, and known disagreements become `expected` entries.
# Its runs are queued behind interactive ones, at most half of submission_max_active_jobs at a time
# (docs/plan-durable-submission.md, Q3).
name: biomodels-curated-300
description: The first 300 curated SBML models in BioModels, each run on COPASI, Tellurium and VCell and compared.
solvers: [copasi, tellurium, vcell]
tolerances: {rel_tol: 1.0e-4, abs_tol_min: 1.0e-3, abs_tol_scale: 1.0e-5}
# known disagreements and solver limits, shown as expected rather than failed: {source, solver?, reason} (run 1's
# findings, 2026-10-22, after pbsim-common 0.1.3.dev0 fixed the adapter bugs behind 62 of its failed runs)
expected:
  - source: biomodels:BIOMD0000000024
    solver: tellurium
    reason: "RoadRunner cannot load delay differential equations (delay(M, …)): a solver limit, not an adapter bug (run 1)"
  - source: biomodels:BIOMD0000000025
    solver: tellurium
    reason: "RoadRunner cannot load delay differential equations (delay(dClk, tau1)): a solver limit, not an adapter bug (run 1)"
  - source: biomodels:BIOMD0000000034
    solver: tellurium
    reason: "RoadRunner cannot load delay differential equations (delay(…)): a solver limit, not an adapter bug (run 1)"
  - source: biomodels:BIOMD0000000043
    reason: "an oscillator (Borghans 1997 calcium) that needs a tighter integrator tolerance than the solvers' default (relative 1e-6): at that default COPASI and RoadRunner each miss the converged run by a score of 1.3-8 on Y, Z and Rho, in different directions; at 1e-12 they agree exactly and at 1e-8 both are within 0.06. The SED-ML sets no tolerance (KISAO:0000694). Investigated 2026-10-23"
  - source: biomodels:BIOMD0000000123
    solver: tellurium
    reason: "CVODE convergence failure (CV_CONV_FAILURE) at the default tolerances (run 1)"
  - source: biomodels:BIOMD0000000137
    solver: tellurium
    reason: "RoadRunner cannot load fast reactions (R12 has fast=true): a solver limit, not an adapter bug (run 1)"
  - source: biomodels:BIOMD0000000152
    solver: tellurium
    reason: "CVODE error-test failure (CV_ERR_FAILURE) at the default tolerances (run 1)"
  - source: biomodels:BIOMD0000000154
    solver: tellurium
    reason: "RoadRunner cannot load delay differential equations (delay(x, tau)): a solver limit, not an adapter bug (run 1)"
  - source: biomodels:BIOMD0000000155
    solver: tellurium
    reason: "RoadRunner cannot load delay differential equations (delay(x, tau)): a solver limit, not an adapter bug (run 1)"
  - source: biomodels:BIOMD0000000196
    solver: tellurium
    reason: "RoadRunner cannot load delay differential equations (delay(x3, tau)): a solver limit, not an adapter bug (run 1)"
