# A two-model smoke suite (docs/plan-sedml.md, phase 6 and "Verification"): the quickest check that SED-ML runs work end
# to end on the deployed service, on both solvers, against one BioModels entry and one biosimulations.org project with
# original results. Run it after a release or an environment change; the larger suites follow.
name: smoke
description: Two models, one from BioModels and one from biosimulations.org with original results, on COPASI and Tellurium.
solvers: [copasi, tellurium]
tolerances: {rel_tol: 1.0e-4, abs_tol_min: 1.0e-3, abs_tol_scale: 1.0e-5}
# the accepted suite run each new run's results are compared with, solver by solver
baseline: 1  # 2026-10-13, compose-api 0.7.21: the first run on the cluster
sources:
  - biomodels:BIOMD0000000012  # Elowitz2000 - Repressilator
  - biosimulations:Morphogenesis-checkpoint-continuous-Ciliberto-J-Cell-Biol-2003  # tellurium 2.2.1
