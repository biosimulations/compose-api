# The SBML Test Suite sample (docs/plan-sbml-test-suite.md, S5 and S9): 146 of release 3.5.0's
# 1789 time-course cases, chosen so every tag and every pair of tags that some case has together is in one of
# them.
# Generated by scripts/sbml_sample_suite.py; regenerate rather than edit the sources. Each case is judged by its
# expected results, with its own tolerances (S3, S4); the solvers' agreement with each other is shown, not decisive.
# 21 of these cases cannot be written as SED-ML yet; their rows say why (findings 9 and 10, S12).
# Each source's comment lists its tags.
name: sbml-test-suite-sample
description: "146 SBML Test Suite 3.5.0 cases covering every tag and every pair of tags, each run on COPASI,
  Tellurium and VCell and judged by the suite's expected results."
