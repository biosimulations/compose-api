[project]
name = "compose-api-client"
# Released in lock-step with the service (docs/strategy.md, packaging): tag.sh bumps both.
version = "0.7.7"
description = "Python client for compose-api: generated from its OpenAPI spec, plus a hand-written application layer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "attrs>=25.4.0",
    "httpx>=0.28.1,<0.29",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.16.1",
    "rich>=13.7",
    "click>=8.1",  # imported directly (click.Context), not only through typer
]

[project.scripts]
compose-api = "compose_api_client.cli:main"

[project.urls]
Repository = "https://github.com/biosimulations/compose-api"
Documentation = "https://github.com/biosimulations/compose-api/blob/main/docs/plan-cli.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compose_api_client"]

[tool.ruff]
# The repository's settings, but this package supports Python 3.11 (the service needs 3.13).
extend = "../../pyproject.toml"
target-version = "py311"
