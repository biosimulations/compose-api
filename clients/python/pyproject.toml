[project]
name = "compose-api-client"
# Released in lock-step with the service (docs/strategy.md, packaging): tag.sh bumps both.
version = "0.7.31"
description = "Python client for compose-api: generated from its OpenAPI spec, plus a hand-written application layer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "attrs>=25.4.0",
    "httpx>=0.28.1,<0.29",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
auth = [
    "authlib>=1.8.0,<2",
    "joserfc>=1.7.5,<2",
    "keyring>=25.7,<26",
    "platformdirs>=4.5.1,<5",
    "portalocker>=3.2,<5",
    "pydantic>=2.11.5,<3",
    "pyjwt[crypto]>=2.15.0,<3",
    "pywin32>=311 ; sys_platform == 'win32'",
]
# [cli] lists [auth]'s dependencies itself rather than naming compose-api-client[auth]: the build flattens such a
# self-reference anyway. tests/cli/test_packaging.py keeps the two lists in step.
cli = [
    "authlib>=1.8.0,<2",
    "joserfc>=1.7.5,<2",
    "keyring>=25.7,<26",
    "platformdirs>=4.5.1,<5",
    "portalocker>=3.2,<5",
    "pydantic>=2.11.5,<3",
    "pyjwt[crypto]>=2.15.0,<3",
    "pywin32>=311 ; sys_platform == 'win32'",
    # >=0.18: older releases do not enforce required arguments under Click 8.3 (a missing one crashed). <0.26: later
    # releases vendor their own Click, so the click types this CLI checks for (Context, ClickException) never match.
    "typer>=0.18,<0.26",
    "rich>=13.7",
    "click>=8.1",  # imported directly (click.Context), not only through typer
]

[project.scripts]
compose-api = "compose_api_client.cli:main"

[project.urls]
Repository = "https://github.com/biosimulations/compose-api"
Documentation = "https://github.com/biosimulations/compose-api/blob/main/docs/plan-cli.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compose_api_client"]

[tool.ruff]
# The repository's settings, but this package supports Python 3.11 (the service needs 3.13).
extend = "../../pyproject.toml"
target-version = "py311"
