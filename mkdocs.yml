site_name: compose-api
repo_url: https://github.com/biosimulations/compose-api
site_url: https://biosimulations.github.io/compose-api
site_description: An API server for reproducible biological workflows and cosimulations.
site_author: Jim Schaff
edit_uri: edit/main/docs/
repo_name: biosimulations/compose-api
copyright: Maintained by <a href="https://biosimulations.com">Florian</a>.

# Internal planning, analysis and grant material lives under docs/ so it is versioned with
# the code and rendered on GitHub, but it is NOT part of the public documentation site.
# mkdocs builds every file under docs/ unless told otherwise, and `on-release-main.yml`
# runs `gh-deploy`, so without this list the next release would publish all of it.
# Verify with: uv run mkdocs build -s -d /tmp/site && find /tmp/site -name index.html
exclude_docs: |
  README.md
  goals.md
  strategy.md
  plan-*.md
  ecosystem-repos.md
  cip/
  grant/

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["compose_api"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/biosimulations/compose-api

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
