description: >-
  viva-cobra's FBAStep on COBRApy's textbook E. coli core model, with glucose uptake 10 and the default bounds, over
  a 1.0 interval from biomass 1.0. The growth rate is COBRApy's own textbook optimum, 0.8739215069684295
  (cobra.io.load_model("textbook").optimize(), default bounds: EX_glc__D_e -10, EX_o2_e -1000). Glucose consumed is
  the uptake times the interval, -10.
document: document.pbg
interval: 1
expect:
  - {kind: rows, emitter: emitter, min: 1}
  - {kind: scalar, emitter: emitter, field: biomass_delta, expected: 0.8739215069684295}
  - {kind: scalar, emitter: emitter, field: substrate_delta.glucose, expected: -10.0}
