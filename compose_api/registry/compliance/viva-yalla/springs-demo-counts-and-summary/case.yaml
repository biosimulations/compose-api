name: springs-demo-counts-and-summary
entry: viva-yalla
description: >-
  The shipped yalla-springs-demo composite (NumPy reproduction, no GPU) trimmed to 20 cells, process interval 0.5,
  seed 1, dt 0.02, run for 2.0 time units. Emits n_cells, gyration_radius, mean_neighbor_distance, sorting_score,
  type_radial_spread and time through RAMEmitter. Expected values: n_cells 20 and time 2.0 and the row count 5 are
  hand-computed (20 agents in the initial sphere, no proliferation since proliferation_rate defaults to 0, 0.5-unit
  emits from t=0 to t=2.0 inclusive). gyration_radius and mean_neighbor_distance at the final row are package output
  (pbg_yalla reproduction under process-bigraph 1.9.1, locked env, 2026-11-03); they are not independently checked.
document: document.pbg
interval: 2.0
expect:
  - {kind: rows, emitter: emitter, min: 5}
  - {kind: scalar, emitter: emitter, field: n_cells, row: -1, expected: 20.0}
  - {kind: scalar, emitter: emitter, field: time, row: -1, expected: 2.0}
  - {kind: scalar, emitter: emitter, field: gyration_radius, row: -1, expected: 0.33090886486076676}
  - {kind: scalar, emitter: emitter, field: mean_neighbor_distance, row: -1, expected: 0.2318006036076406}
  - {kind: scalar, emitter: emitter, field: n_cells, row: 1, expected: 20.0}
