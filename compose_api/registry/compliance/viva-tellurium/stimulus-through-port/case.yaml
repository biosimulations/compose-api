description: >-
  viva-tellurium's TelluriumProcess (v0.2.3) runs the Lipniacki 2004 NF-kB model with its stimulus given through the
  parameters_in input port, and all 15 floating species match COPASI's run of the original model at every compared time,
  within rel 1e-3 or abs 1e-7, whichever is looser (math.isclose). The model is BioModels BIOMD0000000786. It
  pre-equilibrates for 363600 s, then its one event, TNF_stimulation, sets the parameter TNF_R from 0 to 1.
  lipniacki2004_driven.xml is that SBML with only the
  event removed, by viva-multiscale-nfkb's workspace/datasets/lipniacki2004/prep.py (commit 2dcdaa6), sha256
  e3d357b9ac0a1e508ea68d690aea107f3fd7408ffb13d618d307901cd8d17718; TNF_R stays 0 unless an input sets it. The document
  seeds species_overrides with the pre-equilibrated state (the driven model run on libRoadRunner with TNF_R = 0 for
  363600 s, by the same repository's preequilibrate.py) and wires a store holding {TNF_R: 1.0} to parameters_in from
  t = 0. The expected values are COPASI's sim1 of the unmodified BIOMD0000000786, from viva-biomodels'
  datasets/corpus_comparison/corpus_timecourse.parquet at commit e41f7c6 (sha256
  6c7e11910e934ba09903afd5857e64eb30f17722b41ded68ca2dde9ca0bf9d27; engine copasi, job sim1): its six points after
  363600 s, shifted back by 363600 s, written out by viva-multiscale-nfkb's checks/kinetic/make_stimulus_through_port.py
  (commit 2dcdaa6). They come from another engine on the original model, not from this package. The process steps every
  1.2 s, which divides both 363600 s and the corpus times, so each compared time is an exact emitter row. With TNF_R = 0
  on the port, all 90 species expectations fail.
scale_level: molecule
document: document.pbg
files:
- lipniacki2004_driven.xml
