description: >-
  viva-tellurium's TelluriumUTCStep runs the phase-cycle SBML model at output_times 0, 2, ..., 10, and every species
  matches COPASI's own report at those times within a solver-to-solver tolerance (rel and abs 1e-3, as pbsim-common's
  tellurium-phase-cycle case). The step emits time_series and species_trajectories lists, not a numeric_result, so the
  reference is checked value by value; the expected values are pbsim-common's copasi-phase-cycle reference.csv
  (COPASI's output) copied as numbers, not this package's output.
document: document.pbg
files: [phase_cycle.sbml]
interval: 1
expect:
  - {kind: rows, emitter: emitter, min: 1}
  - {kind: scalar, emitter: emitter, field: time_series.0, expected: 0.0}
  - {kind: scalar, emitter: emitter, field: species_trajectories.PX.0, expected: 0.0, rel: 1.0e-3, abs: 1.0e-3}
  - {kind: scalar, emitter: emitter, field: species_trajectories.PY.0, expected: 0.0, rel: 1.0e-3, abs: 1.0e-3}
  - {kind: scalar, emitter: emitter, field: species_trajectories.PZ.0, expected: 0.0, rel: 1.0e-3, abs: 1.0e-3}
  - {kind: scalar, emitter: emitter, field: species_trajectories.X.0, expected: 0.0, rel: 1.0e-3, abs: 1.0e-3}
  - {kind: scalar, emitter: emitter, field: species_trajectories.Y.0, expected: 20.0, rel: 1.0e-3, abs: 1.0e-3}
  - {kind: scalar, emitter: emitter, field: species_trajectories.Z.0, expected: 0.0, rel: 1.0e-3, abs: 1.0e-3}
