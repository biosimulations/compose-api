  # --- Rule-based ---
  - id: viva-nfsim
    package: viva-nfsim
    # v0.2.0 on main (tag and release, confirmed with gh). pbg_nfsim is its only package; the dist name is viva-nfsim.
    # Its types hook registers nothing, so no `types`.
    source: https://github.com/vivarium-collective/viva-nfsim/tree/76ff7fc0f59dea815e8b1c211c03550612357cae
    commit: 76ff7fc0f59dea815e8b1c211c03550612357cae
    install:
      git: https://github.com/vivarium-collective/viva-nfsim
      commit: 76ff7fc0f59dea815e8b1c211c03550612357cae
    # NFsim runs through bionetgen 0.8.7's bundled BNG2.pl, which needs a full Perl with the core FindBin module; the
