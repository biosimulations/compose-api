  # --- Spatial/particle ---
  - id: viva-smoldyn
    package: viva-smoldyn
    # v0.2.0 on main (confirmed with gh). Its types hook registers nothing, so no `types`.
    source: https://github.com/vivarium-collective/viva-smoldyn/tree/54c56a1e3b80ea1afb4e9570e9a1534031db8aca
    commit: 54c56a1e3b80ea1afb4e9570e9a1534031db8aca
