  - id: viva-fenics
    package: viva-fenics
    # v0.1.1 (#16): the standalone FEniCSx package, not the PDE component of viva-pde-particle, which is unchanged.
    # 0.1.1 fixed what a5023cc had: composites imported viva_superpowers, undeclared, and __init__.py swallowed the
    # ImportError so classes vanished; scipy was undeclared. viva-superpowers is now only a `dashboard` extra.
    source: https://github.com/vivarium-collective/viva-fenics/tree/a1105fcae77019f6a2430c612df44c8a285792a6
    commit: a1105fcae77019f6a2430c612df44c8a285792a6
    install:
      git: https://github.com/vivarium-collective/viva-fenics
      commit: a1105fcae77019f6a2430c612df44c8a285792a6
    # dolfinx is conda-only. 0.10.* is the pin viva-pde-particle and vcell-fenics use, inside viva-fenics's own tested
    # range (>=0.10,<0.12, its suite passed on 0.10.0 and 0.11.0), so a set with both never splits on dolfinx.
    # The rest is from that pixi.toml's conda dependencies; pip dependencies come from its pyproject.
    conda:
      fenics-dolfinx: "0.10.*"
      mpich: "*"
      gmsh: "*"
      python-gmsh: "*"
      matplotlib: "*"
      python-dateutil: ">=2.8,<3"
    module_roots:
      - viva_fenics
    level: tested
    evidence:
      - >-
        Listed on 2026-11-03. Its compliance case (registry/compliance/viva-fenics/poisson-quadratic-mms) runs
        PoissonSolverStep on a quadratic manufactured solution, which P2 represents exactly, so the expected L2 error is
        round-off. It needs the dolfinx stack, so it has not run through compose-api's runner or anywhere else here.
        Its one custom type (viva_fenics.types.FENICS_TYPES, fem_field) is on no process's ports at this commit, so
        the entry has no `types`.
      - >-
        Re-pinned to a1105fc (v0.1.1) and raised to tested on 2026-11-03. Its entry set locked through compose-api's own
        path in the pinned pixi image for linux-64 (fenics-dolfinx 0.10.0, scipy 1.18.1), installed with `pixi install
        --frozen`, and poisson-quadratic-mms passed through compose-api's runner, alone and in one set with all seven
        framework entries (all seven cases passed). Importing viva_fenics there loads no viva_superpowers or
        vivarium_workbench.

  # --- core: classes of the engine every composed environment installs (environments.yaml `composition.core`) -------
  # Provided by every composed version and mash-up without being listed or installed, and by the prebuilt images its
  # `bundles` name (docs/plan-environment-composition.md, 7c-1, D7c.2). Its version is the core's.

  - id: process-bigraph-emitters
    kind: core
    package: process-bigraph
    source: https://pypi.org/project/process-bigraph/1.9.1/
    version: "1.9.1"
    module_roots:
      - process_bigraph.emitter
    # the engine registers these under their class name too, so `local:RAMEmitter` (process-bigraph's own default)
    # is checked as `local:process_bigraph.emitter.RAMEmitter`; no other short name is accepted
    short_names:
      - RAMEmitter
      - JSONEmitter
      - ConsoleEmitter
    level: tested
    # viva-pde-particle's image installs process-bigraph 1.9.1 (its read-back, 2026-10-26)
    bundles:
      - viva-pde-particle
    evidence:
      - >-
        Added at tested on 2026-10-27 (composition 7c-1, D7c.2: documents name process-bigraph's emitters fully
        qualified, `local:process_bigraph.emitter.RAMEmitter`). RAMEmitter, JSONEmitter and ConsoleEmitter are
        process-bigraph's own; compose-api's runner gathers RAMEmitter's results into the `.pber` file, and every
        compliance case (pbsim-common's two, viva-basic-processes' one) records its outputs through it, in composed
        versions on 1.9.1. The short names `local:RAMEmitter`, `local:JSONEmitter` and `local:ConsoleEmitter`,
        which the engine registers itself, are accepted as these classes since 2026-10-29 (Jim: documents use them).

  # --- libraries: installed for the components above, with no process classes of their own ------------------------
  # Pinned to what registry_env@1 actually ran (read back from its image, 2026-10-25), not to the old library list,
  # which said tellurium 2.2.11.1 and python-copasi 4.46.300 while the image held these.

  - id: smoldyn-vcell
    kind: library
    package: smoldyn
    # Smoldyn's Python module built with OPTION_VCELL (the hybrid ValueProvider hooks) from the virtualcell fork's
    # pyhybrid branch, by its .github/workflows/vcell-hybrid-wheel.yml (composition 7c-3, D7c.1): on no index
    source: https://github.com/virtualcell/Smoldyn/releases/tag/vcell-pyhybrid-e86d552
    version: "2.76.dev0+vcell.e86d552"
    install:
      url: https://github.com/virtualcell/Smoldyn/releases/download/vcell-pyhybrid-e86d552/smoldyn-2.76.dev0%2Bvcell.e86d552-cp312-cp312-linux_x86_64.whl
      sha256: bb033bccff9481a075603d4a79fefe249b152fac5544a716adf16761adc29d14
    # its extension needs GLIBCXX_3.4.32 (GCC 13.2), newer than the pixi image's system libstdc++; conda-forge's
    # `libstdcxx` has it from 13.3.0 (13.1 and 13.2 were published only as libstdcxx-ng). Without it, a set whose
    # other entries bring no libstdcxx (viva-smoldyn alone) fails `import smoldyn`.
    conda:
      libstdcxx: ">=13.3"
    level: installable
    evidence:
      - >-
        Built at e86d552 by the fork's workflow and released 2026-10-27; the hash is the release asset's, checked on
        download. CPython 3.12 on Linux x86-64; it links libpython, which composed images put on LD_LIBRARY_PATH.

  - id: vcell-fenics
    kind: library
    package: vcell-fenics
    source: https://github.com/virtualcell/vcell-fenics/tree/4dab281e1ed3f7c2b2bb60c6c2d1a8ccb251ca17
    commit: 4dab281e1ed3f7c2b2bb60c6c2d1a8ccb251ca17
    install:
      git: https://github.com/virtualcell/vcell-fenics
      commit: 4dab281e1ed3f7c2b2bb60c6c2d1a8ccb251ca17
    # its package declares no dependencies: its pixi.toml's runtime ones (gmsh is dev-only there, for its licence;
    # dolfinx_mpc nothing under src/ imports; occt's `novtk` build pin a version string cannot say). Before this, a
    # mash-up had them only through viva-pde-particle's, and scifem and meshio not at all.
    conda:
      fenics-dolfinx: "0.10.*"
      mpich: "*"
      petsc4py: "*"
      scifem: "*"
      meshio: "*"
      netgen: ">=6.2.2602,<7"
      matplotlib-base: "*"
      numpy: "*"
      scipy: "*"
      pyyaml: ">=6.0.3,<7"
      scikit-image: "*"
      pydantic: ">=2.10,<3"
    requires:
      - zarr
      - pyvcell
    level: installable
    evidence:
      - The commit viva-pde-particle's pixi.toml pins (main, the merge of #211); its geometry formalism and Netgen realization.

