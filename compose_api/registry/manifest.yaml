    # dependencies: process-bigraph>=1.9.1, bigraph-schema>=1.8.1, cmaboss==1.0.0b34, numpy, typer, rich.
    source: https://github.com/vivarium-collective/viva-maboss/tree/3fdccd7bb605109f3284e6ff9be2616b50b19ca7
    commit: 3fdccd7bb605109f3284e6ff9be2616b50b19ca7
