    conda:
      perl: "*"
    module_roots:
      - pbg_nfsim
    level: tested
    evidence:
      - >-
        Listed on 2026-11-03. Its compliance case (registry/compliance/viva-nfsim/flagella-seeded) runs NFSimProcess on
        the package's flagella model, seed 7, from the model's own seed counts to t = 50. The row count, end time and
        initial flgE are hand-computed; the other values are seeded package output (reproducible run to run, and
        consistent with the model's flhDC stoichiometry). It passed through compose-api's runner (process-bigraph
        1.9.1, bigraph-schema 1.8.1, bionetgen 0.8.7, Python 3.12, macOS with the system Perl) at this commit. Not yet
        verified: FindBin under conda-forge perl, and the numbers from Linux's bundled NFsim build. A composed
        environment has not run it, so this is not yet a tested level. The seed restarts NFsim's RNG every interval.
      - >-
        Raised to tested on 2026-11-03 on composed-environment evidence. Its entry set (with its `requires`) locked through
