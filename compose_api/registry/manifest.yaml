# The simulator registry of record: which process-bigraph components this service will run, pinned, and how far
# each has been checked. Strategy decision 5 (docs/strategy.md) defines the fields and the curation ladder.
#
# Changes land by pull request. Raising an entry's level needs the evidence for the new level in `evidence`.
# An address is accepted on HPC only if its module sits under one of an entry's `module_roots`, that entry is at
# level `tested` or higher, and the entry is part of the bundle the service runs (`registry_env`).
#
# `bundles` names the environments an entry is installed in (environments.yaml): `registry_env`, or a prebuilt
# image's simulator name. CI reads the interfaces each environment provides, over the module roots of its entries,
# into manifests/<environment>.json (docs/plan-authoring.md); every component there must belong to an entry here.
#
# Composed environments (docs/plan-environment-composition.md): `install` says how an entry goes into one, a PyPI
# release (`pypi` + exact `version`) or a git repository at a full `commit`, with `extras`; `conda` lists what only
# conda-forge supplies. A `library` entry provides no process classes: it is installed for a component's sake (an
# engine, or a pin on a component's floating dependency), and its level says only that it installs.

entries:
  - id: pbsim-common
    package: pbsim-common
    # composed versions install this commit (pbsim_common#21: result, comparison and statistic ports overwrite;
    # #22: Tellurium and COPASI report every species, boundary and unchanging ones included; #23: every UTC step
    # reports what SED-ML reads, a substance-only species as its amount and each non-constant parameter and compartment;
    # #24: the COPASI and Tellurium UTC steps take viva's output_times, selections, tolerances and model_in);
    # registry_env@1, built through pbest 0.6.5, still runs 26fa156 (pbsim_common#18's adapter fixes and #20's
    # VCellUTCStep). Back to a PyPI release once 0.1.3 is published.
    source: https://github.com/biosimulations/pbsim_common/tree/8c96e90b5460c02e211ba3994a66be2b8aecdc51
    version: "0.1.3.dev1"
    install:
      git: https://github.com/biosimulations/pbsim_common
      commit: 8c96e90b5460c02e211ba3994a66be2b8aecdc51
    module_roots:
      - pbsim_common
    # numeric_result and the other types its steps' ports use (pbest's core registered them)
    types:
      - pbsim_common:standard_types
    # its steps import these engines, which its package metadata leaves to extras (D7.2)
    requires:
      - tellurium
      - python-copasi
      - pyvcell
      - libvcell
    level: tested
    bundles:
      - registry_env
    evidence:
      - >-
        Grandfathered at tested on 2026-09-23. The gate is this repository's own cluster tests
        (tests/simulators/test_copasi.py, tests/simulators/test_tellurium.py, and the phase_cycle.omex fixture),
        which run CopasiUTCStep and TelluriumUTCStep inside the built registry_env image, not the package's own
        test suite. Phase B of decision 5 replaces this with a computed level.
      - >-
        2026-10-26: the pin moves to 0b456c5 (pbsim_common#21) and the level stays, because registry_env@1 (which has
        no compliance record and so takes this level) still runs 26fa156. A composed version certifies 0b456c5 by
        its compliance cases (registry/compliance/pbsim-common), which decide admission there
        (docs/plan-environment-composition.md, step 5c).
      - >-
        2026-10-26: the pin moves to c6c1804 (pbsim_common#22: every species reported, found by biomodels-curated-300
        run 4, where seven models differed only by a species one adapter left out). Certified the same way.
      - >-
        2026-11-05: the pin moves to cca48d3 (pbsim_common#23: what SED-ML reads, found by sbml-test-suite-sample
        run 1, where 01307, 01455 and 01747 had every solver agree on a concentration where SED-ML reads an amount,
        and a non-constant parameter had no column; docs/plan-sbml-test-suite.md, step 4c.2). Certified the same way;
        the phase-cycle compliance cases still hold (its compartment's size is 1, and they compare only the
        reference's columns).

  - id: pb-multiscale-actin
    package: pb-multiscale-actin
    source: https://pypi.org/project/pb-multiscale-actin/1.3.1/
    version: "1.3.1"
    install:
      pypi: pb-multiscale-actin
      version: "1.3.1"
    module_roots:
      - pb_multiscale_actin
    level: tested
    bundles:
      - registry_env
    evidence:
      - >-
        Grandfathered at tested on 2026-09-23. The gate is this repository's own cluster test
        (tests/simulators/test_readdy.py with the readdy.omex fixture), which runs ReaddyActinMembrane and
        SimulariumEmitter inside the built registry_env image, not the package's own test suite. Phase B of
        decision 5 replaces this with a computed level.

  - id: viva-pde-particle
    package: viva-pde-particle
    source: https://github.com/vivarium-collective/viva-pde-particle
    # viva-pde-particle#69's merge (2026-10-29): SpatialExport's output replaces, not accumulates (the generic check
    # step-outputs-replace refused it before). What a composed environment installs, and the commit of the prebuilt
    # image (viva-pde-particle-compose:sha-7043882) registered as viva-pde-particle@3; #67's merge, 21dfe46, was @2
    commit: 70438826a348cfb3feddbc928e2c9038129ff69e
    # composed too (docs/plan-environment-composition.md 7c, D7c.1-D7c.3): its engines from conda-forge, as its own
    # pixi.toml's `compose` environment has them, less the Smoldyn toolchain; Smoldyn is the smoldyn-vcell wheel
    install:
      git: https://github.com/vivarium-collective/viva-pde-particle
      commit: 70438826a348cfb3feddbc928e2c9038129ff69e
      extras: [reference]
    conda:
      fenics-dolfinx: "0.10.*"
      mpich: "*"
      gmsh: "*"
      python-gmsh: "*"
      h5py: "*"
      netgen: ">=6.2.2602,<7"
      scikit-image: "*"
      pydantic: ">=2.10,<3"
      vtk: "*"
      pyvista: ">=0.49.0,<0.50"
      imageio: ">=2.38.0,<3"
    # what its pixi.toml adds beyond its package metadata: Smoldyn, the VCell solver and geometry, results bundles
    requires:
      - smoldyn-vcell
      - vcell-fenics
      - pyvcell-fvsolver
      - zarr
      - pyvcell
      - libvcell
    module_roots:
      - viva_pde_particle
    level: tested
    # its own prebuilt image runs a document of its classes alone (D7c.3); composed, they join a mash-up
    bundles:
      - viva-pde-particle
    evidence:
      - >-
        Raised to tested on 2026-10-12. Its image, the environment it runs in here, is built and checked by the
        package's own CI on every push to main (.github/workflows/compose-image.yml): a smoke ensemble in Docker,
        then this service's exact job contract under `apptainer run --compat` with /experiment bound, before the
        image is pushed. The pinned digest passed both.
      - >-
        Composed on 2026-10-27 (7c-4): with registry_env@5's entries in one pixi lock (472 packages, no conflict), its
        example ensemble (four PDE + Smoldyn trials) gave values identical to its prebuilt image's through
        compose-api's runner. In a composed version its compliance case (registry/compliance/viva-pde-particle)
        decides its level.

  - id: biosim-toolkit
    package: biosim-toolkit
    source: https://github.com/biosimulations/biosim-toolkit
    version: "0.1.0"
    install:
      pypi: biosim-toolkit
      version: "0.1.0"
    module_roots:
      - biosim_toolkit
    level: tested
    bundles:
      - registry_env
    evidence:
      - >-
        Added at tested on 2026-10-13 (docs/plan-sedml.md, D11). Its CI runs translated SED-ML archives
        (BIOMD0000000012, Ciliberto 2003) end to end the way this service's runner does, on pbsim-common's COPASI and
        Tellurium steps, with registry_env's process-bigraph 1.0.5 and bigraph-schema 1.0.14, and checks that the two
        solvers agree. The gate here, as for pbsim-common, is this repository's cluster test inside the built
        registry_env image (tests/simulators/test_sedml.py).

  # The first component composed only into mash-ups (docs/plan-environment-composition.md, step 7b): no declared
  # environment lists it, so a run that uses its classes beside another entry's gets an environment made for both.
  - id: viva-basic-processes
    package: viva-basic-processes
    # not on PyPI; its v0.3.0 tag predates the pbg -> viva rename (it installs as pbg-basic-processes), so a commit
    source: https://github.com/vivarium-collective/viva-basic-processes/tree/9a1a624dc925cf700c3f89a8cc008a8fa4b4e5d4
    commit: 9a1a624dc925cf700c3f89a8cc008a8fa4b4e5d4
    install:
      git: https://github.com/vivarium-collective/viva-basic-processes
      commit: 9a1a624dc925cf700c3f89a8cc008a8fa4b4e5d4
    module_roots:
      - viva_basic_processes
    level: tested
    evidence:
      - >-
        Added at tested on 2026-10-26 for composition step 7b (Jim chose it from the catalog). Its compliance case
        (registry/compliance/viva-basic-processes/intervention-and-expression) runs Intervention, MathExpressionStep
        and Clock together through compose-api's runner on process-bigraph 1.9.1 and bigraph-schema 1.8.1 and matches
        values computed by hand; it passed locally on 2026-10-26. MathExpressionStep's outputs are overwrite[float],
        so the generic step-outputs-replace check passes. In a composed version, the case run there decides its level.

  # --- ODE/SBML ---
  # viva-biomodels: HELD, not added. Reasons: a workspace (bypass-selection), no Process classes (only Steps),
  # branch-only sibling sources, viva-superpowers and viva-simbio undeclared, and BIOMD0000000027 not shipped (it needs
  # a live BioModels fetch). See the pull request body.
  - id: viva-copasi
    package: viva-copasi
    # an alternative to pbsim-common, whose CopasiUTCStep and siblings (the same class names) are the standard set
    # the service runs; pbsim-common's UTC steps take this one's output_times, selections, tolerances and model_in.
    # Until the two are reconciled.
    alternative_to: pbsim-common
    # v0.2.2 on main (confirmed with gh). pbg_copasi, the deprecation shim, is not a module root.
    source: https://github.com/vivarium-collective/viva-copasi/tree/937ff132f2e8c755248a38a7440067f8d1871001
    commit: 937ff132f2e8c755248a38a7440067f8d1871001
    install:
      git: https://github.com/vivarium-collective/viva-copasi
      commit: 937ff132f2e8c755248a38a7440067f8d1871001
    module_roots:
      - viva_copasi
    # numeric_result and the other types its steps' ports use; the runner registers no package's build_core
    types:
      - viva_copasi.types:standard_types
    # one python-copasi pin beside pbsim-common's in a mash-up
    requires:
      - python-copasi
    level: tested
    evidence:
      - >-
        Listed on 2026-11-03. Its compliance case (registry/compliance/viva-copasi/phase-cycle-copasi-report) runs
        CopasiUTCStep on the phase-cycle model and checks it against COPASI's own report, pbsim-common's reference.csv.
        The case passed through compose-api's runner (COMPOSE_RUNNER_TYPES from `types` above; process-bigraph 1.9.1,
        bigraph-schema 1.8.1, Python 3.12, macOS) at this commit. Without `types` it fails to load, since the runner
        registers no package's build_core. A composed environment has not run it, so this is not yet a tested level.
      - >-
        The pin moved from v0.2.0 (0399533) to v0.2.1 (ed3fafa), which adds `any` to viva_copasi.types:standard_types:
        CopasiSteadyStateStep and ParameterEstimationStep emit `any`, which bigraph-schema 1.8.1 does not register,
        so its steady-state composite failed on the runner's core before it.
      - >-
        The pin moved from v0.2.1 (ed3fafa) to v0.2.2 (937ff13), review follow-ups: a valid boundary-species test
        fixture, `species_units: amount` refused at construction rather than at run, and the types module's docstring
        naming `viva_copasi.types:standard_types`. The case passed through the runner again at v0.2.2.
      - >-
        Raised to tested on 2026-11-03 on composed-environment evidence. Its entry set (with its `requires`) locked through
        compose-api's own path (Manifest.with_requirements, ComposedSpec.of, pixi_toml, build_k8s.lock_script) in the
        pinned pixi image for linux-64; `pixi install --frozen` installed it; and its compliance case passed through
        compose-api's runner in that environment, both for this group alone and in one set holding all seven
        framework entries.

  - id: viva-tellurium
    package: viva-tellurium
    # an alternative to pbsim-common, whose TelluriumUTCStep and siblings (the same class names) are the standard set
    # the service runs; pbsim-common's UTC steps take this one's output_times, selections, tolerances and model_in.
    # Until the two are reconciled.
    alternative_to: pbsim-common
    # v0.2.3 on main (viva-tellurium#37, confirmed with gh). pbg_tellurium, the deprecation shim, is not a module root.
    # Its types module registers nothing, so no `types`.
    source: https://github.com/vivarium-collective/viva-tellurium/tree/846f87c57058a6bfa383619c9ae7587f0d81453c
    commit: 846f87c57058a6bfa383619c9ae7587f0d81453c
    install:
      git: https://github.com/vivarium-collective/viva-tellurium
      commit: 846f87c57058a6bfa383619c9ae7587f0d81453c
    module_roots:
      - viva_tellurium
    # one tellurium pin beside pbsim-common's in a mash-up
    requires:
      - tellurium
    level: tested
    evidence:
      - >-
        Listed on 2026-11-03. Its compliance case (registry/compliance/viva-tellurium/phase-cycle-copasi-report) runs
        TelluriumUTCStep on the phase-cycle model at output_times 0, 2, ..., 10 and checks every species against
        COPASI's own report (pbsim-common's reference.csv) within rel and abs 1e-3. It passed through compose-api's
        runner (process-bigraph 1.9.1, bigraph-schema 1.8.1, tellurium 2.2.13.1, Python 3.12, macOS) at this commit.
        A composed environment has not run it, so this is not yet a tested level.
      - >-
        The pin moved from v0.2.0 (e056d34) to v0.2.1 (967d5dd): the workspace image installs the `dashboard` extra
        (with a uv default group `workbench`), the `cli` extra is restored, and the visualization error is clearer.
        Its runtime path is unchanged; the case passed through the runner again at v0.2.1.
      - >-
        Raised to tested on 2026-11-03 on composed-environment evidence. Its entry set (with its `requires`) locked through
        compose-api's own path (Manifest.with_requirements, ComposedSpec.of, pixi_toml, build_k8s.lock_script) in the
        pinned pixi image for linux-64; `pixi install --frozen` installed it; and its compliance case passed through
        compose-api's runner in that environment, both for this group alone and in one set holding all seven
        framework entries.
      - >-
        The pin moved from v0.2.1 (967d5dd) to v0.2.3 (846f87c) on 2026-11-04. v0.2.2 takes vivarium-workbench from git
        for the `dashboard` extra only (a `[tool.uv.sources]` line), so the runtime dependencies are unchanged. v0.2.3
        (viva-tellurium#37) adds TelluriumProcess's `parameters_in` input: `{parameter_id: value}` set before each
        interval, the whole map validated first, and a no-op when empty or unwired. A second case
        (registry/compliance/viva-tellurium/stimulus-through-port) runs TelluriumProcess on BIOMD0000000786 with its
        TNF_stimulation event removed and TNF_R set through that port. It checks all 15 floating species at six times
        against COPASI's sim1 of the original model (viva-biomodels' corpus), within rel 1e-3 or abs 1e-7. With TNF_R = 0
        on the port, or at v0.2.1, which has no such port, 90 of its 91 expectations fail. Both cases passed through
        compose-api's runner (process-bigraph 1.9.1, bigraph-schema 1.8.1, tellurium 2.2.13.1, Python 3.12, macOS) at
        846f87c.
      - >-
        Raised to tested again on 2026-11-04, for 846f87c, on composed-environment evidence (a new pin starts again at
        listed). Its entry set (with its `requires`) locked through compose-api's own path (Manifest.with_requirements,
        ComposedSpec.of, pixi_toml, build_k8s.lock_script) in the pinned pixi image for linux-64; `pixi install --frozen`
        installed it; and both compliance cases passed through compose-api's runner in that environment. That held for
        this group alone, for it with viva-maboss, viva-basic-processes and viva-pde-particle (the set
        viva-multiscale-nfkb's composite runs in), and for one set holding all seven framework entries.

