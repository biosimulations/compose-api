  - id: viva-fenics
    package: viva-fenics
    # v0.1.2 (#18, be157ab): the standalone FEniCSx package, not the PDE component of viva-pde-particle, which is
    # unchanged. 0.1.1 fixed what a5023cc had: composites imported viva_superpowers, undeclared, and __init__.py
    # swallowed the ImportError so classes vanished; scipy was undeclared. viva-superpowers is now only a `dashboard`
    # extra. 0.1.2 declares every Step output overwrite[...], so step-outputs-replace no longer refuses its Steps.
    source: https://github.com/vivarium-collective/viva-fenics/tree/be157ab1bc3d1556960a9cd140634280b0473aa1
    commit: be157ab1bc3d1556960a9cd140634280b0473aa1
