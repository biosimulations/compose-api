      commit: 54c56a1e3b80ea1afb4e9570e9a1534031db8aca
    module_roots:
      - viva_smoldyn
    # it declares plain `smoldyn`, but PyPI's 2.76 wheel does not import on Linux CPython 3.12; the fork wheel does
    requires:
      - smoldyn-vcell
    level: tested
    evidence:
      - >-
        Listed on 2026-11-03. Its compliance case (registry/compliance/viva-smoldyn/seeded-decay-2d) runs SmoldynProcess
        in 2D, seed 7, 200 A converting to B. The row count and times are hand-computed; the counts are package output,
        reported identical on Linux (the fork wheel, CPython 3.12) and macOS (PyPI, CPython 3.14). It passed through
        compose-api's runner (process-bigraph 1.9.1, bigraph-schema 1.8.1) on macOS with PyPI smoldyn 2.76 under
        CPython 3.14, because PyPI's macOS CPython 3.12 wheel does not import either. Not yet verified: that a lock
        picks the smoldyn-vcell URL wheel for its unconstrained `smoldyn` requirement. A composed environment has not
        run it, so this is not yet a tested level.
      - >-
        Raised to tested on 2026-11-03 on composed-environment evidence. Its entry set (with its `requires`) locked through
        compose-api's own path (Manifest.with_requirements, ComposedSpec.of, pixi_toml, build_k8s.lock_script) in the
