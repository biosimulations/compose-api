        PoissonSolverStep on a quadratic manufactured solution, which P2 represents exactly, so the expected L2 error is
        round-off. It needs the dolfinx stack, so it has not run through compose-api's runner or anywhere else here.
        Its one custom type (viva_fenics.types.FENICS_TYPES, fem_field) is on no process's ports at this commit, so
        the entry has no `types`.
      - >-
        Re-pinned to a1105fc (v0.1.1) and raised to tested on 2026-11-03. Its entry set locked through compose-api's own
        path in the pinned pixi image for linux-64 (fenics-dolfinx 0.10.0, scipy 1.18.1), installed with `pixi install
        --frozen`, and poisson-quadratic-mms passed through compose-api's runner, alone and in one set with all seven
        framework entries (all seven cases passed). Importing viva_fenics there loads no viva_superpowers or
        vivarium_workbench.
      - >-
        Moved to v0.1.2 (be157ab) on 2026-11-19. All four of its Steps (AdaptiveRefinementStep, PorousFlowStep,
        PoissonSolverStep, MultisolutePoreStep) had declared bare float, integer and array[float] outputs, which add
        into a store, so step-outputs-replace refused every one in mash-425e535ee9@1 (#542). 0.1.2 declares all 20
        outputs overwrite[...], and its regression tests fail on the old types. poisson-quadratic-mms passed through
        compose-api's runner at this commit (process-bigraph 1.9.1, bigraph-schema 1.8.1, dolfinx 0.11.0, macOS).
        Existing versions keep a1105fc; a new version of an environment that holds this entry picks it up.

  # --- Tissue mechanics ---
  - id: vivarium-tyssue
    package: vivarium-tyssue
    # vivarium-tyssue#37's merge (2026-11-19, Tasnif): the compose-api fixes asked for in #34–#36, over #33's
    # dependencies (tyssue from the vivarium-collective fork at 29671f1; viva-copasi and viva-emitters pinned by
    # commit). No tags yet. The `sim` extra is what installs tyssue.
    source: https://github.com/vivarium-collective/vivarium-tyssue/tree/5cd5cd9946d099e65dcfa0a5747b75589368b41f
    commit: 5cd5cd9946d099e65dcfa0a5747b75589368b41f
    install:
      git: https://github.com/vivarium-collective/vivarium-tyssue
      commit: 5cd5cd9946d099e65dcfa0a5747b75589368b41f
      extras: [sim]
    # The solver, Gillespie, the regulators and, since #37, the SBML cell cycle, which parses its phase rules and
    # compiles SBML math into numpy closures instead of evaluating or generating code.
    module_roots:
      - vivarium_tyssue.processes.eulersolver
      - vivarium_tyssue.processes.gillespie
      - vivarium_tyssue.processes.regulations
      - vivarium_tyssue.processes.cell_cycle
    level: tested
    evidence:
      - >-
        Added at tested on 2026-11-17 on composed-environment evidence, at this commit. Its entry set locked through
        compose-api's own path (pixi_toml, then `pixi lock` in the pinned pixi image for linux-64; 145 PyPI packages,
        every git source at a commit: this one, the tyssue fork 29671f1, viva-copasi 6ab8c7b, viva-emitters 591133c;
        viva-superpowers 0.23.0 and vivarium-workbench 0.3.92 from the index), and `pixi install --frozen` installed it.
        Its compliance case (registry/compliance/vivarium-tyssue/sheet-relaxation) passed through compose-api's runner
        there, twice with byte-identical results, and agrees exactly with tyssue's own solver at every emitted time.
        It needs the runner to write pandas DataFrames, which the same release adds. No `types`: bigraph-schema 1.8.1
        registers vivarium_tyssue.data_types' `register_types` hook itself. process-bigraph-lang's read-back over these
        roots found 10 components and no import errors; step-outputs-replace refuses exactly ParameterGradient and
        AnisotropicTension, Steps whose `behaviors: list[node]` output appends, and the other eight run. The package's
        own suite at this commit, on process-bigraph 1.9.1 and bigraph-schema 1.8.1: 152 passed, 0 failed (45 skipped
        for unbuilt Rust kernels and the like, 1 xfailed). Its runtime dependencies include development tooling
        (viva-superpowers, vivarium-workbench, viva-copasi, and viva-emitters with its parquet extra), which lands in the
        run image. Its visualizations module imports viva_superpowers, so that import runs whenever a core is built.
        Moving the tooling to an extra, as viva-pde-particle did, is the package's follow-up.
      - >-
        EulerSolver reads the mesh the document names with pandas, which unpickles object columns and some attributes,
        so an uploaded mesh could run code. The service refuses such an HDF5 file at submission (registry/uploads.py).
        test_square.hf5 holds plain data; six of the workspace's seven meshes have object columns and are refused until
        they are saved without them.
      - >-
        Moved to vivarium-tyssue#37's merge (5cd5cd9) on 2026-11-19; its two commits change no dependency file. (#34)
        ParameterGradient and AnisotropicTension are Processes that ship deltas: each remembers the share it last
        contributed (`_Contribution`) and emits the change, so the parameter settles at the regulator's value rather
        than accumulating; step-outputs-replace no longer applies to them. (#35) SBMLCellCycle parses each phase rule
        against one comparison pattern (cell_cycle.py `_CONDITION`, operators from a fixed table) and compiles SBML math
        by walking libsbml's AST into numpy closures, raising on any node it does not support (sbml/vectorized.py); no
        `eval`, `exec`, `compile` or code generation remains under vivarium_tyssue, so its module is now a root.
        python-libsbml is already a runtime dependency. (#36) All seven workspace meshes pass registry/uploads.py's
        HDF5 check at this commit; six were refused before. sheet-relaxation is unchanged; its result at this commit is
        the compliance run of the version made from it.
      - >-
        On the core of 2026-11-23 (process-bigraph 1.11.1, bigraph-schema 1.8.3) sheet-relaxation fails while the
        composite is built: 1.11 drops EulerSolver's empty `cell_df` from the initial state, and bigraph-schema 1.8.3's
        Frame merge then fails on an update of None. bigraph-schema 1.8.4 fixes it (bigraph-schema #209), and
        process-bigraph 1.11.1 requires bigraph-schema below 1.8.4. The version on 1.9.1 keeps running; a version made
        on this core records this entry `failed` there, and stays so: once the core can take 1.8.4, an administrator
        makes a new version (a run makes only a mash-up's first, D7.7).

  # --- core: classes of the engine every composed environment installs (environments.yaml `composition.core`) -------
  # Provided by every composed version and mash-up without being listed or installed, and by the prebuilt images its
  # `bundles` name (docs/plan-environment-composition.md, 7c-1, D7c.2). Its version is the core's.

  - id: process-bigraph-emitters
    kind: core
    package: process-bigraph
    source: https://pypi.org/project/process-bigraph/1.11.1/
    version: "1.11.1"
    module_roots:
      - process_bigraph.emitter
    # the engine registers these under their class name too, so `local:RAMEmitter` (process-bigraph's own default)
    # is checked as `local:process_bigraph.emitter.RAMEmitter`; no other short name is accepted
    short_names:
      - RAMEmitter
      - JSONEmitter
      - ConsoleEmitter
    level: tested
    # viva-pde-particle's image installs process-bigraph 1.9.1 (its read-back, 2026-10-26)
    bundles:
      - viva-pde-particle
    evidence:
      - >-
        Added at tested on 2026-10-27 (composition 7c-1, D7c.2: documents name process-bigraph's emitters fully
        qualified, `local:process_bigraph.emitter.RAMEmitter`). RAMEmitter, JSONEmitter and ConsoleEmitter are
        process-bigraph's own; compose-api's runner gathers RAMEmitter's results into the `.pber` file, and every
        compliance case (pbsim-common's two, viva-basic-processes' one) records its outputs through it, in composed
        versions on 1.9.1. The short names `local:RAMEmitter`, `local:JSONEmitter` and `local:ConsoleEmitter`,
        which the engine registers itself, are accepted as these classes since 2026-10-29 (Jim: documents use them).
      - >-
        The core moves to process-bigraph 1.11.1 and bigraph-schema 1.8.3 (Alex, 2026-11-23: v2ecoli's
        ecoli_baseline has a step cycle across priorities, which 1.9.1 refuses and 1.11 runs; 1.11.1 requires
        bigraph-schema below 1.8.4). Checked on 2026-11-23 with compose-api's own lock and build Jobs (linux/amd64
        under emulation), on the new core and on 1.9.1 and 1.8.1: registry_env and a mash-up of each other component
        that has cases lock, build and read back their core. Their conda packages are the same on both cores; their
        PyPI packages differ only in the core and in what 1.11.1 no longer requires (scipy, sympy and matplotlib, with
        their dependencies, where nothing else needs them). vivarium-tyssue's set also takes viva-superpowers 0.30.0
        instead of 0.23.0 (it needs bigraph-schema 1.8.2 or later), and with it viva-discovery-engine 0.7.5, typer,
        shellingham and filelock; viva-discovery-engine requires bigraph-schema, so its modules are imported whenever
        the core is built. Through the runner, 14 of the 16 cases pass on both cores with the same results, except
        that 1.11.1 records the seeded store values in row 0 (t = 0), where 1.9.1 left them empty (viva-tellurium's
        stimulus-through-port, viva-smoldyn's seeded-decay-2d). vivarium-tyssue's sheet-relaxation fails on 1.11.1
        (that entry says why). viva-fenics' poisson-quadratic-mms fails on both cores on 2026-11-23, for a reason
        outside the core: conda-forge's yaml 0.2.6 (2026-11-23) ships libyaml-0.so.1 instead of the libyaml-0.so.2
        petsc 3.25.6 links, so viva_fenics does not import. With yaml held below 0.2.6, as the entries that bring
        PETSc now hold it, it passes on both cores, with identical results.
        Existing versions keep their images; each environment's next version is checked against its cases.

  - id: v2ecoli
    package: v2ecoli
    # A private repository (docs/plan-private-repo-usage.md, P5): only callers holding repo-v2ecoli see or use it, or
    # anything made of it. Pinned to #972 (a serialized `method` value imports its module only on the owner's
    # opt-in), on main after #970 (the Metabolism evidence test), #971 (EcoliWCM builds its sim input from the
    # packaged ParCa state, and loads the files a document names only on the owner's opt-in) and #942 (every git
    # source pinned to a commit).
    source: https://github.com/vivarium-collective/v2ecoli/tree/f86adf0565cab1713c92d6fc88bd6a639260befe
    commit: f86adf0565cab1713c92d6fc88bd6a639260befe
    install:
      git: https://github.com/vivarium-collective/v2ecoli
      commit: f86adf0565cab1713c92d6fc88bd6a639260befe
    access_role: repo-v2ecoli
    # v2ecoli publishes no wheel: its sdist compiles three Cython extensions (wholecell.utils: _build_sequences,
    # _fastsums, mc_complexation) with plain `gcc`, which the pixi image does not have
    conda:
      gcc: "*"
    # Only the whole-cell class: v2ecoli.bridge holds EcoliWCM and nothing else a document can name. v2ecoli's other
    # processes and steps take configs that name files they unpickle or import, so they stay out of reach until each is
    # reviewed for that.
    module_roots:
      - v2ecoli.bridge
    # Every type EcoliWCM's ports name (v2ecoli/types: ECOLI_WCM_TYPES), not the full ECOLI_TYPES. That doesn't keep
    # v2ecoli's `method` type out: bigraph-schema's discovery registers it in any core, and a serialized method names
    # a module to import. Since #972 that import needs the owner's opt-in, which compose-api never sets.
    types:
      - v2ecoli.types:ECOLI_WCM_TYPES
    level: tested
    evidence:
      - >-
        Added at tested on 2026-11-24 on composed-environment evidence, at this commit, on process-bigraph 1.11.1 and
        bigraph-schema 1.8.3. Its mash-up was locked with compose-api's own lock Job script in the pinned pixi image
        (linux-64, the service user): 282 PyPI packages, Python 3.12.16, gcc 16.2.0 from conda-forge, v2ecoli recorded
        by its GitHub URL at this commit. It was built with compose-api's own build Job, its private source fetched by
        compose-api's clone container and file-URL gitconfig (locally the clone was of the same commit, so no
        credential entered a container; production fetches it with its GitHub App token, whose credential helper P2
        proved locally with a real token; minting one from the service is P5's production pre-flight). The image is
        1.2 GB, its definition is the version's byte for byte, and process-bigraph-lang's read-back over these roots
        found EcoliWCM and the core's emitters and no import errors. Its compliance case
        (registry/compliance/v2ecoli/single-cell-growth) passed twice through the job script's own `apptainer run`
        line, with byte-identical results. A document carrying a serialized `method` that names another module is
        refused by the runner (v2ecoli #972's UntrustedFileError) before that module runs.
      - >-
        It needs vecoli 1.1.2.post4 (PyPI, 2026-11-24; vivarium-collective/vEcoli #10), which v2ecoli's vEcoli>=1.1.0
        resolves to. Through 1.1.2.post3, vEcoli's runscripts/analysis.py read the command line when imported, and
        bigraph-schema's discovery imports it, so the runner's `-n <end time>` ended every run at start. A version
        resolved before that release locks 1.1.2.post3 and cannot run v2ecoli.

  # --- libraries: installed for the components above, with no process classes of their own ------------------------
  # Pinned to what registry_env@1 actually ran (read back from its image, 2026-10-25), not to the old library list,
  # which said tellurium 2.2.11.1 and python-copasi 4.46.300 while the image held these.

  - id: smoldyn-vcell
    kind: library
    package: smoldyn
    # Smoldyn's Python module built with OPTION_VCELL (the hybrid ValueProvider hooks) from the virtualcell fork's
    # pyhybrid branch, by its .github/workflows/vcell-hybrid-wheel.yml (composition 7c-3, D7c.1): on no index
    source: https://github.com/virtualcell/Smoldyn/releases/tag/vcell-pyhybrid-e86d552
    version: "2.76.dev0+vcell.e86d552"
    install:
      url: https://github.com/virtualcell/Smoldyn/releases/download/vcell-pyhybrid-e86d552/smoldyn-2.76.dev0%2Bvcell.e86d552-cp312-cp312-linux_x86_64.whl
      sha256: bb033bccff9481a075603d4a79fefe249b152fac5544a716adf16761adc29d14
    # its extension needs GLIBCXX_3.4.32 (GCC 13.2), newer than the pixi image's system libstdc++; conda-forge's
    # `libstdcxx` has it from 13.3.0 (13.1 and 13.2 were published only as libstdcxx-ng). Without it, a set whose
    # other entries bring no libstdcxx (viva-smoldyn alone) fails `import smoldyn`.
    conda:
      libstdcxx: ">=13.3"
    level: installable
    evidence:
      - >-
        Built at e86d552 by the fork's workflow and released 2026-10-27; the hash is the release asset's, checked on
        download. CPython 3.12 on Linux x86-64; it links libpython, which composed images put on LD_LIBRARY_PATH.

