# The simulator registry of record: which process-bigraph components this service will run, pinned, and how far
# each has been checked. Strategy decision 5 (docs/strategy.md) defines the fields and the curation ladder.
#
# Changes land by pull request. Raising an entry's level needs the evidence for the new level in `evidence`.
# An address is accepted on HPC only if its module sits under one of an entry's `module_roots`, that entry is at
# level `tested` or higher, and the entry is part of the bundle the service runs (`registry_env`).
#
# `bundles` names the environments an entry is installed in (environments.yaml): `registry_env`, or a prebuilt
# image's simulator name. CI reads the interfaces each environment provides, over the module roots of its entries,
# into manifests/<environment>.json (docs/plan-authoring.md); every component there must belong to an entry here.

entries:
  - id: pbsim-common
    package: pbsim-common
    # installed from this commit through pbest 0.6.5 until 0.1.3 is on PyPI (pbsim_common#18's adapter fixes, and
    # pbsim_common#20's VCellUTCStep, which needs pyvcell[native,ode] from simulator_registry.json)
    source: https://github.com/biosimulations/pbsim_common/tree/26fa156cfab2c309150be818774be4a0c307ce3b
    version: "0.1.3.dev1"
    module_roots:
      - pbsim_common
    level: tested
    bundles:
      - registry_env
    evidence:
      - >-
        Grandfathered at tested on 2026-09-23. The gate is this repository's own cluster tests
        (tests/simulators/test_copasi.py, tests/simulators/test_tellurium.py, and the phase_cycle.omex fixture),
        which run CopasiUTCStep and TelluriumUTCStep inside the built registry_env image, not the package's own
        test suite. Phase B of decision 5 replaces this with a computed level.

  - id: pb-multiscale-actin
    package: pb-multiscale-actin
    source: https://pypi.org/project/pb-multiscale-actin/1.3.1/
    version: "1.3.1"
    module_roots:
      - pb_multiscale_actin
    level: tested
    bundles:
      - registry_env
    evidence:
      - >-
        Grandfathered at tested on 2026-09-23. The gate is this repository's own cluster test
        (tests/simulators/test_readdy.py with the readdy.omex fixture), which runs ReaddyActinMembrane and
        SimulariumEmitter inside the built registry_env image, not the package's own test suite. Phase B of
        decision 5 replaces this with a computed level.

  - id: viva-pde-particle
    package: viva-pde-particle
    source: https://github.com/vivarium-collective/viva-pde-particle
    # the commit behind the deployed image (PREBUILT_SIMULATORS pins its digest, tagged sha-8c16827)
    commit: 8c168271e3b48ac667cde9092ca025be0f444d65
    module_roots:
      - viva_pde_particle
    level: tested
    # its own prebuilt image, not registry_env: it runs only with `simulator=viva-pde-particle`
    bundles:
      - viva-pde-particle
    evidence:
      - >-
        Raised to tested on 2026-10-12. Its image, the environment it runs in here, is built and checked by the
        package's own CI on every push to main (.github/workflows/compose-image.yml): a smoke ensemble in Docker,
        then this service's exact job contract under `apptainer run --compat` with /experiment bound, before the
        image is pushed. The pinned digest passed both.

  - id: biosim-toolkit
    package: biosim-toolkit
    source: https://github.com/biosimulations/biosim-toolkit
    version: "0.1.0"
    module_roots:
      - biosim_toolkit
    level: tested
    bundles:
      - registry_env
    evidence:
      - >-
        Added at tested on 2026-10-13 (docs/plan-sedml.md, D11). Its CI runs translated SED-ML archives
        (BIOMD0000000012, Ciliberto 2003) end to end the way this service's runner does, on pbsim-common's COPASI and
        Tellurium steps, with registry_env's process-bigraph 1.0.5 and bigraph-schema 1.0.14, and checks that the two
        solvers agree. The gate here, as for pbsim-common, is this repository's cluster test inside the built
        registry_env image (tests/simulators/test_sedml.py).
