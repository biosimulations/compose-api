apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: compose-api-local

images:
  - name: ghcr.io/biosimulations/compose-api
    newTag: 0.7.5
  - name: docker.io/library/mongo
    newTag: 8.3.11

replicas:
  - count: 1
    name: api
  - count: 0
    name: mongodb

resources:
  - ingress.yaml
  - api-certificate.yaml
  - selfsigned-issuer.yaml
  - api-pvc.yaml
  - haproxy-ssh-svc.yaml
  - compose-api-home-pv.yaml
  - compose-api-home-pvc.yaml
  - mongodb-pvc.yaml
  - secret-ghcr.yaml
  - secret-shared.yaml
  - secret-ssh.yaml
  - ../../config/compose-api-rke
  - ../../base

# The API pods here load ../../config/compose-api-rke, the production config. Override only the
# Auth0 keys so this cluster never accepts production tokens (or production, dev ones).
configMapGenerator:
  - name: api-config
    behavior: merge
    envs:
      - auth0.env
