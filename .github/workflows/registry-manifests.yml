# Read the process interfaces each environment provides, inside its image (strategy decision 5, phase B;
# docs/plan-authoring.md). One job per environment in compose_api/registry/environments.yaml runs
# `python -m compose_api.registry.generate --env <name>`, which runs process-bigraph-lang's standalone describe script
# in the image and writes compose_api/registry/manifests/<name>.json (pbg-interfaces/1).
#
# On a pull request the manifests are only uploaded as artifacts (to review, or to commit into that pull request).
# Otherwise a pull request is opened when one changed; it needs "Allow GitHub Actions to create and approve pull
# requests" in the repository's Actions settings. The service serves the manifests once a release ships them.
name: Registry manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: a rebuilt shared image can change what an unchanged pin provides
  push:
    branches: [main]
    paths:
      - compose_api/registry/environments.yaml
      - compose_api/registry/environments.py
      - compose_api/registry/generate.py
      - compose_api/registry/manifest.yaml
      - compose_api/simulation/simulator_registry.json
      - kustomize/config/compose-api-rke/api.env
      - .github/workflows/registry-manifests.yml
  pull_request:
    paths:
      - compose_api/registry/environments.yaml
      - compose_api/registry/environments.py
      - compose_api/registry/generate.py
      - compose_api/registry/manifest.yaml
      - compose_api/simulation/simulator_registry.json
      - kustomize/config/compose-api-rke/api.env
      - .github/workflows/registry-manifests.yml

concurrency:
  group: registry-manifests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  environments:
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - id: list
        run: echo "names=$(uv run python -m compose_api.registry.generate --list)" >> "$GITHUB_OUTPUT"

  describe:
    needs: environments
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(needs.environments.outputs.names) }}
    steps:
      - name: Free disk space (the images are several GB)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-python-env
      - name: Log in to GHCR (the shared image's package is private)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Describe ${{ matrix.name }}
        run: uv run python -m compose_api.registry.generate --env "${{ matrix.name }}" --out manifests
      - uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ matrix.name }}
          path: manifests/${{ matrix.name }}.json
          if-no-files-found: error

  propose:
    needs: describe
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: manifest-*
          path: compose_api/registry/manifests
          merge-multiple: true
      - name: Open a pull request when a manifest changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: registry-manifests/update
          commit-message: "chore(registry): regenerate the environments' interface manifests"
          title: "chore(registry): regenerate the environments' interface manifests"
          body: |
            Generated by `.github/workflows/registry-manifests.yml` (`python -m compose_api.registry.generate`):
            each environment's step and process classes, read inside its image. Review what changed, then merge;
            the service serves them from the next release.
          add-paths: compose_api/registry/manifests/*.json
