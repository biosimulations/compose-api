name: CLI platforms

# The CLI on the systems people sign in from, against each runner's real credential store: macOS Keychain, Windows
# Credential Manager, and a Secret Service unlocked for the job on Linux. The deterministic CLI tests already run on
# Linux in Main's Python matrix; this adds the other operating systems and the real stores, which mocks cannot stand
# in for. It writes only synthetic records under random names and deletes them, and it needs no secrets.
#
# Run before merging changes to the client, its tests, or the environment used by this matrix.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "clients/python/**"
      - "tests/cli/**"
      - "tests/client/**"
      - "tests/fixtures/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - ".github/actions/setup-python-env/**"
      - ".github/workflows/cli-platforms.yml"
      - "scripts/client-smoke.py"

permissions:
  contents: read

jobs:
  cli:
    name: CLI on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: "3.14"

      # No Docker here, which the CLI tests never need; the conftest imports the server's fixtures but starts none.
      - name: Run the CLI tests
        run: >-
          uv run python -m pytest tests/cli tests/client/test_ext_security.py
          tests/client/test_credential_contract.py -o addopts= -p no:cacheprovider

      - name: Install a Secret Service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus

      # On Windows a realistic session exceeds Credential Manager's 2560-byte limit; the test asserts that it is
      # refused cleanly, which is the documented behaviour until sessions are stored in that limit.
      - name: Exercise the real credential store
        env:
          COMPOSE_API_TEST_OS_KEYRING: "1"
        run: |
          test="uv run python -m pytest tests/cli/test_os_keyring.py -o addopts= -p no:cacheprovider -v"
          if [ "$RUNNER_OS" = Linux ]; then
            dbus-run-session -- sh -c "printf ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && $test"
          else
            $test
          fi

      - name: Build the wheel and run the installed command
        run: |
          uv build --package compose-api-client --wheel --out-dir dist
          wheel="$(ls dist/compose_api_client-*.whl)"
          uvx --python 3.14 --from "${wheel}[cli]" compose-api --version
          uvx --python 3.14 --from "${wheel}[cli]" compose-api auth --help
          uvx --python 3.14 --from "${wheel}[cli]" compose-api run --help

      # The tests above run on 3.14 inside the workspace (the service needs 3.13+), but the client supports 3.11, and
      # `--help` never reaches the code whose behaviour depends on the Python version. Install the wheel alone on 3.11
      # (`--no-config`: the root's uv overrides would otherwise apply) and run that code.
      - name: Run the installed client on its oldest Python
        run: |
          wheel="$(ls dist/compose_api_client-*.whl)"
          floor() { uv run --no-project --no-config --python 3.11 --with "${wheel}[cli]" "$@"; }
          floor python -I scripts/client-smoke.py
          floor compose-api --help >/dev/null
