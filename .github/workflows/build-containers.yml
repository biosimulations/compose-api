name: Update Code and Push Docker Image
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Repository tag (e.g., 1.2.3)"
        required: true

env:
  python-version: "3.14"

jobs:
  CD:
    name: CD
    runs-on: ubuntu-26.04

    steps:
      # A manual run must build the tag it is given, not the branch it was started from:
      # the image is pushed under that tag, and production pulls it with imagePullPolicy: Always.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ env.python-version }}

      - name: Set ENV Variables
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG_NAME=${INPUT_TAG}" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=${GITHUB_REF##*/}" >> "$GITHUB_ENV"
          fi
          echo "CREATED=$(date --rfc-3339=seconds | sed 's/ /T/')" >> "$GITHUB_ENV"

      - name: build and push
        run: |
          set -ux
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          ./kustomize/scripts/build_and_push.sh "${TAG_NAME}"
