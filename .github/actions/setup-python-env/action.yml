name: "Setup Python Environment"
description: "Set up Python environment for the given Python version"

inputs:
  python-version:
    description: "Python version to use"
    required: true
    default: "3.14"
  uv-version:
    description: "uv version to use"
    required: true
    default: "0.12.12"

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v10.1.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: "true"
        cache-suffix: ${{ matrix.python-version }}

    # `uv` resolves its own interpreter from `.python-version` and ignores the one
    # setup-python just installed, which made every matrix leg run the same version.
    # Exporting UV_PYTHON pins it for every later `uv sync` and `uv run` in the job, so
    # the matrix tests what it claims to.
    - name: Pin uv to the matrix interpreter
      run: echo "UV_PYTHON=${{ inputs.python-version }}" >> "$GITHUB_ENV"
      shell: bash

    - name: Install Python dependencies
      run: uv sync --frozen
      shell: bash

    - name: Report the interpreter actually in use
      run: uv run python -c "import sys; print(sys.version)"
      shell: bash
