repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v5.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        exclude: ^kustomize/
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]
        # npm writes its own lockfile; reformatting it makes every `npm install` a diff.
        exclude: ^webapp/package-lock\.json$
      # Fixtures copied verbatim from a running system must not be reformatted. The
      # simulator definition is identified by an md5 over its exact bytes, so appending
      # the newline this hook likes changes the hash and the file stops being a copy of
      # what production recorded. Learned by having it happen.
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures/resources|webapp/test/fixtures/.*\.fenics)/
      - id: trailing-whitespace
        exclude: ^(tests/fixtures/resources|webapp/test/fixtures/.*\.fenics)/

  # Must match the `ruff` pin in pyproject.toml. When they drift, the two disagree on
  # import order and `make check` oscillates on the same file forever, each run
  # "fixing" what the other just did.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.16.6"
    hooks:
      - id: ruff-check
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
